<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabriel Lima De Paula Advocacia</title>
<meta name="description" content="Gabriel Lima De Paula Advocacia – todos os contatos em um só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ouro:#d4a514;--ouro-claro:#f0c230;--ouro-escuro:#8a6a08;--preto:#0c0b09;--grafite:#1a1812;--texto:#f6f1e3}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--texto);background:var(--preto);
 background-image:
  radial-gradient(ellipse 80% 45% at 50% -5%,rgba(212,165,20,.38),transparent 70%),
  radial-gradient(ellipse 60% 40% at 100% 100%,rgba(138,106,8,.28),transparent 70%);
 background-attachment:fixed;display:flex;justify-content:center;padding:44px 20px 28px;position:relative;overflow-x:hidden}
/* balança da justiça como marca d'água */
body::before{content:"";position:fixed;inset:0;opacity:.055;pointer-events:none;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none' stroke='%23f0c230' stroke-width='1.6' stroke-linecap='round'><path d='M50 12v70M30 82h40M18 26h64M18 26l-9 24h18zM82 26l-9 24h18zM9 50a9 5 0 0018 0M73 50a9 5 0 0018 0'/></svg>") center 62%/min(120vw,620px) no-repeat}
main{width:100%;max-width:440px;position:relative;text-align:center}
.foto{width:132px;height:132px;border-radius:50%;margin:0 auto 18px;padding:4px;
 background:linear-gradient(135deg,var(--ouro-claro),var(--ouro-escuro));box-shadow:0 10px 30px rgba(212,165,20,.3);
 animation:entra .7s ease both}
.foto img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center center;border:3px solid var(--preto);display:block}
h1{font-weight:800;animation:entra .7s .08s ease both;line-height:1.15}
h1 span{display:block}
.nome{font-size:1.65rem;letter-spacing:.2px}
.cargo{margin-top:6px;font-size:1.05rem;font-weight:700;letter-spacing:.35em;text-transform:uppercase;color:var(--ouro-claro);padding-left:.35em}
.desc{margin:6px auto 0;font-weight:500;color:#cfc6ab;font-size:1rem;max-width:32ch;line-height:1.45;animation:entra .7s .14s ease both}
.links{display:flex;flex-direction:column;gap:14px;list-style:none}
.links li{opacity:0;animation:entra .6s ease forwards}
.links li:nth-child(1){animation-delay:.25s}.links li:nth-child(2){animation-delay:.35s}
.links li:nth-child(3){animation-delay:.45s}.links li:nth-child(4){animation-delay:.55s}
.links li:nth-child(5){animation-delay:.65s}
.btn{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;text-decoration:none;
 font-weight:700;font-size:1.05rem;color:var(--texto);background:var(--grafite);border:1.5px solid rgba(212,165,20,.35);
 box-shadow:0 6px 16px rgba(0,0,0,.45);transition:transform .25s ease,box-shadow .25s ease,background .25s ease,color .25s ease,border-color .25s ease}
.btn svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--ouro-claro);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:stroke .25s}
.btn span{flex:1;text-align:left}
.btn:hover,.btn:focus-visible{transform:translateY(-3px);background:linear-gradient(135deg,var(--ouro-claro),var(--ouro));
 color:#17130a;border-color:var(--ouro-claro);box-shadow:0 12px 26px rgba(212,165,20,.35);outline:none}
.btn:hover svg,.btn:focus-visible svg{stroke:#17130a}
.btn.destaque{background:linear-gradient(135deg,var(--ouro-claro),var(--ouro));color:#17130a;border-color:var(--ouro-claro)}
.btn.destaque svg{stroke:#17130a}
.btn.destaque:hover{filter:brightness(1.07)}
footer{margin-top:38px;font-size:.8rem;color:#8d856d;animation:entra .7s .8s ease both;opacity:0}
  .desc2{margin:8px auto 30px;animation-delay:.2s}
@keyframes entra{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;opacity:1!important}}
</style>
</head>
